name: 지원금헌터 매일 발행

on:
  schedule:
    # UTC 23:00 (일~목) = KST 08:00 (월~금). 즉 KST 기준 평일 아침 8시 실행.
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 즉시 테스트 가능

permissions:
  contents: write

env:
  # <계정>.github.io/<저장소명>/ 형태로 실제 값으로 바꿔서 넣을 것 (MY_SETUP_CHECKLIST.md 참고)
  PAGES_URL: ${{ vars.PAGES_URL }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r automation/requirements.txt

      - name: 구독자 명단 복원 (비공개 Secret → 로컬 CSV, 저장소엔 절대 커밋 안 됨)
        env:
          SUBSCRIBERS_CSV_B64: ${{ secrets.SUBSCRIBERS_CSV_B64 }}
        run: |
          if [ -n "$SUBSCRIBERS_CSV_B64" ]; then
            echo "$SUBSCRIBERS_CSV_B64" | base64 -d > automation/subscribers.csv
          fi

      - name: 오늘의 다이제스트 생성 (기업마당 + K-Startup 수집 → HTML/RSS/ICS/위젯/검색색인/사이트맵)
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
          ADSENSE_SLOT_TOP: ${{ vars.ADSENSE_SLOT_TOP }}
          ADSENSE_SLOT_MID: ${{ vars.ADSENSE_SLOT_MID }}
          ADSENSE_SLOT_BOTTOM: ${{ vars.ADSENSE_SLOT_BOTTOM }}
          ADSENSE_SLOT_LEFT: ${{ vars.ADSENSE_SLOT_LEFT }}
          ADSENSE_SLOT_RIGHT: ${{ vars.ADSENSE_SLOT_RIGHT }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
          KAKAO_ID: ${{ vars.KAKAO_ID }}
          KAKAO_OPENCHAT_URL: ${{ vars.KAKAO_OPENCHAT_URL }}
        run: python build_digest.py
        working-directory: automation

      - name: 이메일 발송 (Brevo — 키/구독자 없으면 자동으로 건너뜀)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: 지원금헌터
        run: python send_email_brevo.py
        working-directory: automation

      - name: 디스코드/슬랙 웹훅 중계 (설정 없으면 자동으로 건너뜀)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python notify_webhooks.py
        working-directory: automation

      - name: 브라우저 푸시 발송 (OneSignal — 설정 없으면 자동으로 건너뜀)
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python notify_onesignal.py
        working-directory: automation

      - name: 구독자 CSV 흔적 제거 (커밋 대상에서 완전히 제외)
        run: rm -f automation/subscribers.csv

      - name: 결과물(docs/) 커밋 & 푸시 → GitHub Pages 자동 반영
        run: |
          git config user.name "benefit-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: 오늘의 다이제스트 $(date -u +'%Y-%m-%d')"
          git push

      - name: 네이버·Bing에 즉시 색인 요청 (IndexNow — PAGES_URL 없으면 자동으로 건너뜀)
        run: python notify_indexnow.py
        working-directory: automation
